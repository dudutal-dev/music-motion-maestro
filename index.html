<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Maestro Studio — מוזיקה, ניתוח ודמות מנגנת</title>
<meta name="description" content="ספריית מוזיקה מנותחת, יוצר דמויות וסטוריבורד, ודמות שמנגנת בסינכרון מושלם לאקורדים ולתווים.">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <main class="main" id="main">
    <div class="topbar" id="topbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input id="search" type="search" placeholder="חפש שיר, אמן או ז׳אנר…" aria-label="חיפוש">
      </div>
      <button class="btn btn-primary btn-sm" data-action="add-track">+ הוסף שיר</button>
    </div>
    <div id="view"><!-- rendered by app.js --></div>
  </main>

  <aside class="sidebar" id="sidebar"><!-- rendered by app.js --></aside>

  <div class="player" id="player"><!-- rendered by app.js --></div>
</div>

<!-- YouTube audio source. Kept off-screen: the visual is the performer on stage,
     the video itself is only the sound source. -->
<div style="position:fixed;width:1px;height:1px;opacity:.01;pointer-events:none;bottom:0;inset-inline-start:0;overflow:hidden">
  <div id="yt-mount"></div>
</div>

<script src="js/data.js"></script>
<script src="js/analysis.js"></script>
<script src="js/audio-analysis.js"></script>
<script src="js/performer.js"></script>
<script src="js/player.js"></script>
<script src="js/characters.js"></script>
<script src="js/lessons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
